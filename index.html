/* v49 interface refresh */
:root{--app-bg:#f7f3ec;--surface:#fffdfa;--surface-2:#fff;--ink:#111b3a;--muted-2:#5f6982;--line:#e5ddd2;--blue:#0f51e3;--blue-2:#1f5af0;--green-bg:#edf8ee;--green:#137333;--red-bg:#fdeeee;--red:#bf1f1f;--orange-bg:#fff3e9;--orange:#d9730d;--chip-blue:#edf1ff;--shadow:0 10px 25px rgba(22,31,70,.08)}
body{background:var(--app-bg);color:var(--ink)}

main{padding:20px 18px 110px}
.nav{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:30;background:rgba(255,253,250,.98);backdrop-filter:blur(12px);display:grid;grid-template-columns:repeat(4,1fr);gap:0;padding:10px 12px calc(12px + env(safe-area-inset-bottom));border-top:1px solid #dfd8cc;box-shadow:0 -8px 30px rgba(20,20,20,.06)}
.nav .btn{background:transparent;color:#222b47;border:none;border-radius:0;padding:6px 4px 4px;display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center;font-weight:700;font-size:13px;min-width:0;position:relative}

.nav .btn.active::after{content:'';position:absolute;top:-10px;left:22%;right:22%;height:4px;border-radius:99px;background:var(--blue)}
.card,.tent{background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:20px;box-shadow:var(--shadow);margin:14px 0}
.btn{border-radius:18px;padding:13px 18px;font-weight:800;background:#ece8e0;color:var(--ink)}

.red{background:var(--red-bg);color:var(--red)}

.status-pill svg{width:20px;height:20px}.status-green{background:var(--green-bg);color:var(--green)}.status-red{background:var(--red-bg);color:var(--red)}.status-gray{background:#eceff1;color:#59616c}

.metric-orange{background:var(--orange-bg);color:var(--orange)}
.job-actions{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}
.job-actions .btn{padding:16px 18px;font-size:18px;border-radius:18px}
.job-actions .btn.secondary{background:#fff;color:var(--blue);border:2px solid rgba(15,81,227,.7)}

.job-actions .btn.finish-job:hover{background:#d6eddc}
.job-empty{padding:24px;border:1px dashed #d8cfc2;border-radius:24px;background:#fffdfa;color:#5f6982;text-align:center}

.calendar-summary{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}.calendar-day-title{margin:2px 0}.calendar-detail-list{display:flex;flex-direction:column;gap:16px}.calendar-empty{padding:8px 0;color:#5f6982}.staff-day .count strong{font-size:10px;display:block;margin-top:2px}.staff-day.selected.available{background:#eef3ff;border-color:#0f51e3}.staff-day.selected.available .count,.staff-day.selected.available .small,.staff-day.selected.available .num{color:#10214f}

/* v97 · fælles iPhone-safe ramme og fast navigation */
:root{
  --pala-safe-top:env(safe-area-inset-top,0px);
  --pala-safe-bottom:env(safe-area-inset-bottom,0px);
  --pala-header-bar:100px;
  --pala-nav-bar:74px;
}
html{
  min-height:100%;
  background:#fffdfa;
  overflow-x:hidden;
  overscroll-behavior-y:none;
}
body{
  position:relative;
  width:100%;
  min-height:100vh;
  min-height:100dvh;
  padding-top:calc(var(--pala-header-bar) + var(--pala-safe-top));
  background:var(--app-bg);
  overflow-x:hidden;
  overscroll-behavior-y:none;
}
header{
  position:fixed;
  inset:0 0 auto 0;
  width:100%;
  height:calc(var(--pala-header-bar) + var(--pala-safe-top));
  min-height:0;
  padding:var(--pala-safe-top) 0 0;
  z-index:40;
}
header .shell{
  height:var(--pala-header-bar);
  min-height:0;
  display:flex;
  align-items:center;
}
header .brand{width:100%;min-width:0}
.brand-name{min-width:0}
.header-actions{flex:0 0 auto;margin-left:auto}
main{
  min-height:calc(100vh - var(--pala-header-bar) - var(--pala-safe-top));
  min-height:calc(100dvh - var(--pala-header-bar) - var(--pala-safe-top));
  padding-top:18px;
  padding-bottom:calc(var(--pala-nav-bar) + var(--pala-safe-bottom) + 18px);
}
.nav{
  position:fixed!important;
  top:auto!important;
  bottom:0!important;
  min-height:calc(var(--pala-nav-bar) + var(--pala-safe-bottom));
  padding-top:6px;
  padding-bottom:max(5px,var(--pala-safe-bottom));
  align-items:start;
}
.nav .btn{
  min-height:62px;
  padding-top:6px;
  padding-bottom:4px;
}
.nav .btn.active::after{top:-6px}

@media(max-width:620px){
  :root{
    --pala-header-bar:66px;
    --pala-nav-bar:62px;
  }
  header .shell{padding-left:12px;padding-right:12px}

  main{

    padding-bottom:calc(var(--pala-nav-bar) + var(--pala-safe-bottom) + 14px);
  }
  .nav{
    left:0!important;
    right:0!important;
    width:100%!important;
    max-width:none!important;
    transform:none!important;
    gap:0;
    padding-left:6px;
    padding-right:6px;
  }

  let owned=Math.max(0,+total||0),out=warehouseOut(type,id),drying=type==='tent'?warehouseDrying(type,id):0;
  let unavailable=type==='tent'?Math.max(out,drying):out;
  let available=Math.max(0,owned-unavailable);
  return {owned,out,drying,available};
}

function loadExternalLibrary(key,src,ready){
  if(ready())return Promise.resolve(true);if(externalLibraryPromises.has(key))return externalLibraryPromises.get(key);
  let promise=new Promise((resolve,reject)=>{
    let script=document.createElement('script');script.src=src;script.async=true;script.dataset.palaLibrary=key;
    script.onload=()=>ready()?resolve(true):reject(new Error(`${key} blev ikke indlæst korrekt`));script.onerror=()=>reject(new Error(`${key} kunne ikke indlæses`));document.head.appendChild(script);
  }).catch(error=>{externalLibraryPromises.delete(key);throw error});
  externalLibraryPromises.set(key,promise);return promise;
}
async function ensurePdfTools(){
  try{
    await loadExternalLibrary('jspdf','https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js',()=>!!window.jspdf?.jsPDF);
    await loadExternalLibrary('jspdf-autotable','https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.4/dist/jspdf.plugin.autotable.min.js',()=>typeof window.jspdf?.jsPDF?.API?.autoTable==='function');
    return true;
  }catch(error){console.warn(error);return false}
}
async function ensureQrTools(){
  try{return await loadExternalLibrary('qrcode','https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js',()=>typeof QRCode!=='undefined')}
  catch(error){console.warn(error);return false}
}
async function createQrDataUrl(text){
  if(!await ensureQrTools())throw new Error('QR-biblioteket kunne ikke indlæses');
  return new Promise((resolve,reject)=>{
    try{
      if(typeof QRCode==='undefined')return reject(new Error('QR-biblioteket kunne ikke indlæses'));
      let host=document.createElement('div');
      host.style.position='fixed';host.style.left='-9999px';host.style.top='-9999px';
      document.body.appendChild(host);
      new QRCode(host,{text,width:256,height:256,correctLevel:QRCode.CorrectLevel.M});
      setTimeout(()=>{
        let canvas=host.querySelector('canvas'),img=host.querySelector('img'),data=canvas?.toDataURL('image/png')||img?.src||'';
        host.remove();
        data?resolve(data):reject(new Error('QR-koden kunne ikke genereres'));
      },80);
    }catch(e){reject(e)}
  });
}

function mutedOrderColor(color){let value=String(color||ORDER_COLORS[0]).toUpperCase();return LEGACY_MUTED_COLORS[value]||value}
function displayOrderColor(b){return jobLocationStatus(b)==='Afsluttet'?COMPLETED_COLOR:mutedOrderColor(b?.color)}
function jobLocationStatus(b){return b?.status==='Afsluttet'?'Afsluttet':b?.status==='Ude'||b?.status==='Udleveret'?'Ude':'På lager'}
function statusRank(s){let i=STATUS_ORDER.indexOf(s);return i<0?999:i}
function sortOrders(a,b){
  if(orderSort==='date_desc')return String(b.start_date||'').localeCompare(String(a.start_date||''));
  if(orderSort==='status')return statusRank(jobLocationStatus(a))-statusRank(jobLocationStatus(b))||String(a.start_date||'').localeCompare(String(b.start_date||''));
  if(orderSort==='customer_asc')return alpha(a.customer_name||a.title||a.order_no,b.customer_name||b.title||b.order_no);
  if(orderSort==='customer_desc')return alpha(b.customer_name||b.title||b.order_no,a.customer_name||a.title||a.order_no);
  if(orderSort==='order_asc')return alpha(a.order_no||a.customer_name||a.title,b.order_no||b.customer_name||b.title);
  return String(a.start_date||'').localeCompare(String(b.start_date||''));
}

function textOnColor(hex){
  let h=String(hex||'#3158E8').replace('#','');
  if(h.length===3)h=h.split('').map(x=>x+x).join('');
  let r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);
  return ((r*299+g*587+b*114)/1000)>155?'#17353b':'#ffffff';
}

const MAIN_MENU_FLOW=[
  {name:'calendar',id:'nc',url:()=>location.pathname},
  {name:'staffing',id:'ns',url:()=>location.pathname+'?staff=1'},
  {name:'warehouse',id:'np',url:()=>location.pathname+'?warehouse=1'},
  {name:'workshop',id:'nw',url:()=>location.pathname+'?workshop=1'},
  {name:'admin',id:'na',url:()=>location.pathname+'?admin=tents'}
];
function availableMainMenus(){
  return MAIN_MENU_FLOW.filter(menu=>{let button=document.getElementById(menu.id);return button&&!button.hidden&&getComputedStyle(button).display!=='none'});
}
function activeMainMenuName(){
  let active=MAIN_MENU_FLOW.find(menu=>document.getElementById(menu.id)?.classList.contains('active'));
  if(active)return active.name;
  let params=new URLSearchParams(location.search);
  if(params.has('staff'))return 'staffing';
  if(params.has('warehouse')||params.has('t')||params.has('i')||params.has('h'))return 'warehouse';
  if(params.has('workshop')||params.has('damage'))return 'workshop';
  if(params.has('admin'))return 'admin';
  return 'calendar';
}
function renderMainMenu(name){
  if(name==='calendar')return showCalendar();
  if(name==='staffing')return showStaffing();
  if(name==='warehouse')return showTents();
  if(name==='workshop')return showWorkshop();
  if(name==='admin'&&isAdminLoggedIn())return showAdmin();
}
function navigateMainMenu(name,options={}){
  if(!isEmployeeLoggedIn())return;
  let menus=availableMainMenus(),target=menus.find(menu=>menu.name===name);if(!target)return;
  let current=activeMainMenuName();
  if(current===name){window.scrollTo({top:0,behavior:options.instant?'auto':'smooth'});return}
  if(options.history!==false){
    history.replaceState({...((history.state&&typeof history.state==='object')?history.state:{}),palaScrollY:window.scrollY},'',location.href);
    history.pushState({palaMenu:name,palaScrollY:0},'',target.url());
  }
  let rendered=renderMainMenu(name);
  Promise.resolve(rendered).finally(()=>requestAnimationFrame(()=>window.scrollTo({top:Math.max(0,+options.restoreScroll||0),behavior:'auto'})));
  return rendered;
}
function swipeMainMenu(direction){
  if(!isEmployeeLoggedIn())return false;
  let menus=availableMainMenus(),index=menus.findIndex(menu=>menu.name===activeMainMenuName());
  if(index<0)return false;
  let next=index+(direction>0?1:-1);if(next<0||next>=menus.length)return false;
  navigateMainMenu(menus[next].name);return true;
}
function flowGestureBlockedTarget(target){
  return !!target?.closest?.('input,textarea,select,[contenteditable="true"],.calendar-large-wrap,.calendar-strip,.warehouse-tabs,.checklist,.code,.nfc-link-tools,.dialog-backdrop,.nav,header');
}
function setupFlowNavigation(){
  if(document.documentElement.dataset.palaFlowReady)return;
  document.documentElement.dataset.palaFlowReady='1';
  let touchStart=null,suppressClickUntil=0,wheelX=0,wheelAt=0,wheelCooldown=0;
  document.addEventListener('touchstart',event=>{
    if(event.touches.length!==1||flowGestureBlockedTarget(event.target)){touchStart=null;return}
    let touch=event.touches[0];touchStart={x:touch.clientX,y:touch.clientY,time:Date.now()};
  },{passive:true});
  document.addEventListener('touchend',event=>{

  },{passive:true});

  },{passive:true});
  window.addEventListener('popstate',event=>{

async function copyNfcLink(value,button){

    try{let field=document.createElement('textarea');field.value=value;field.setAttribute('readonly','');field.style.position='fixed';field.style.opacity='0';document.body.appendChild(field);field.select();copied=document.execCommand('copy');field.remove()}catch(e){}

function normalizedSearchText(value){
  return String(value||'').toLocaleLowerCase('da-DK').normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}
function matchesSearch(query,...values){
  let q=normalizedSearchText(query);
  return values.some(value=>normalizedSearchText(value).includes(q));
}
function bookingAddress(value){
  if(value&&typeof value==='object'&&value.address)return String(value.address).trim();
  let notes=String(value&&typeof value==='object'?value.notes:value||''),match=notes.match(/\[PALA-ADRESSE\s+([^\]]*)\]/i);if(!match)return '';
  try{return decodeURIComponent(match[1]).trim()}catch(e){return match[1].trim()}
}
function cleanBookingNotes(value){return String(value&&typeof value==='object'?value.notes:value||'').replace(/\n?\[PALA-ADRESSE\s+[^\]]*\]/gi,'').trim()}
function bookingNotesWithAddress(notes,address){let clean=cleanBookingNotes(notes),place=String(address||'').trim();return place?`${clean}${clean?'\n':''}[PALA-ADRESSE ${encodeURIComponent(place)}]`:clean}
function googleMapsLink(address){let place=String(address||'').trim();return place?`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(place)}`:''}
function updateOrderAddressLink(){let address=document.getElementById('oaddress')?.value||'',link=document.getElementById('orderAddressMapLink');if(!link)return;link.href=googleMapsLink(address)||'#';link.hidden=!address.trim()}

      shiftResults=staffingShifts.filter(sh=>{

  let group=(title,items)=>items.length?`<section class="search-group"><h3>${esc(title)} · ${items.length}</h3>${items.join('')}</section>`:'';

async function openOrderChecklist(token,phase){
  currentCheckToken=token||currentCheckToken;
  history.replaceState(null,'',`${location.pathname}?check=${encodeURIComponent(currentCheckToken)}`);
  document.querySelectorAll('.nav .btn').forEach(x=>x.classList.remove('active'));
  app.innerHTML='<div class="card"><h2>Henter pakkeliste…</h2></div>';

  if(r.error){
    app.innerHTML=`<div class="card"><h2>Pakkelisten kunne ikke åbnes</h2><p>${esc(r.error.message)}</p></div>`;
    return;
  }

  let data=r.data||{},order=data.order||{},lines=Array.isArray(data.lines)?data.lines:[],
      actionable=lines.filter(l=>(+l.qty_required||0)>0),
      packedDone=actionable.filter(l=>(+l.packed_qty||0)>=(+l.qty_required||0)).length,
      returnedDone=actionable.filter(l=>(+l.returned_qty||0)>=(+l.qty_required||0)).length,
      packedPct=actionable.length?Math.round(packedDone/actionable.length*100):100,
      returnedPct=actionable.length?Math.round(returnedDone/actionable.length*100):100;

  let tentLines=lines.filter(l=>l.line_type==='tent'),
      looseHardware=lines.filter(l=>l.line_type==='hardware'&&!tentLines.some(t=>+t.item_id===+l.parent_tent_id)),
      inventoryLines=lines.filter(l=>l.line_type==='inventory');

  let renderLine=line=>{
    let qty=+line.qty_required||0,packed=(+line.packed_qty||0)>=qty,returned=(+line.returned_qty||0)>=qty;
    return `<div class="simple-check-line ${returned?'scan-done':''}">
      <div>
        <div class="simple-check-name">${esc(line.item_name)}</div>
        ${line.description?`<div class="small muted">${esc(line.description)}</div>`:''}

      </div>
      <div class="check-dual-actions">
        <button class="check-phase-button ${packed?'done':''}" onclick="toggleOrderChecklistLinePhase(${line.id},'packed',${packed},${returned})" title="${packed?'Fortryd pakket':'Markér pakket'}">${uiIcon(packed?'check':'box')}<span>Pakket</span></button>
        <button class="check-phase-button returned ${returned?'done':''}" onclick="toggleOrderChecklistLinePhase(${line.id},'returned',${returned},${packed})" title="${returned?'Fortryd returneret':'Markér returneret'}">${uiIcon(returned?'check':'refresh')}<span>Returneret</span></button>
      </div>
    </div>`;
  };

  let tentHtml=tentLines.map(t=>{
    let hardware=lines.filter(h=>h.line_type==='hardware'&&+h.parent_tent_id===+t.item_id);
    let dryingHtml=globalWetControls(t.item_id),returned=(+t.returned_qty||0)>=(+t.qty_required||0);
    return `<div class="simple-check-tent">
      <h3>${uiIcon('tent','ui-icon icon-card')} ${esc(t.item_name)}</h3>
      ${renderLine(t)}
      ${hardware.map(renderLine).join('')}
      ${dryingHtml}
      <div style="margin-top:10px"><button class="btn ${returned?'primary':''}" onclick="showDamageForm(${t.item_id},${+order.id||'null'},'checklist')">${uiIcon('scissors')} ${returned?'Registrér skade efter retur':'Registrér skade'}</button></div>
    </div>`;
  }).join('');

  app.innerHTML=`<div class="card">
    <div class="row">
      <div>
        <div class="small muted">PAK / RETUR</div>
        <h2 style="margin-bottom:5px">${esc(order.customer_name||order.title||order.order_no||'Ordre')}</h2>
        <div class="small muted">${esc(order.order_no||'')} · ${esc(fmtDateDa(order.start_date))} - ${esc(fmtDateDa(order.end_date))}</div>
        ${bookingAddress(order)?`<a class="job-map-link compact" href="${esc(googleMapsLink(bookingAddress(order)))}" target="_blank" rel="noopener">${uiIcon('mapPin')} ${esc(bookingAddress(order))}</a>`:''}
      </div>

    </div>

    <div class="check-progress-grid">
      <div class="check-progress-card"><div class="row"><b>${uiIcon('box')} Pakket</b><b>${packedDone}/${actionable.length}</b></div><div class="scan-progress"><div style="width:${packedPct}%"></div></div></div>
      <div class="check-progress-card returned"><div class="row"><b>${uiIcon('refresh')} Returneret</b><b>${returnedDone}/${actionable.length}</b></div><div class="scan-progress"><div style="width:${returnedPct}%"></div></div></div>
    </div>

    ${returnedDone===actionable.length&&actionable.length?`<div class="return-complete-banner">${uiIcon('check')} Alt er returneret · jobbet markeres automatisk som afsluttet</div>`:''}

  <div class="card">

async function toggleOrderChecklistLinePhase(lineId,phase,isDone,otherDone){
  if(phase==='returned'&&!isDone&&!otherDone){
    let packed=await sb.rpc('order_checklist_change',{p_access_token:currentCheckToken,p_line_id:lineId,p_phase:'packed',p_delta:0,p_set_all:true});
    if(packed.error)return alert(packed.error.message);
  }
  if(phase==='packed'&&isDone&&otherDone)return alert('Fortryd returneringen først, hvis delen ikke længere skal stå som pakket.');
  let r=await sb.rpc('order_checklist_change',{p_access_token:currentCheckToken,p_line_id:lineId,p_phase:phase,p_delta:isDone?-999999:0,p_set_all:!isDone});
  if(r.error)return alert(r.error.message);
  await refreshWarehouseStatus();
  openOrderChecklist(currentCheckToken);
}
async function autoFinishReturnedOrder(order){
  if(!order?.id||jobLocationStatus(order)==='Afsluttet')return;
  let saved=false;
  if(isAdminLoggedIn()){
    let result=await sb.rpc('admin_finish_booking',{p_token:adminToken,p_booking_id:+order.id});
    saved=!result.error;
  }
  let booking=bookings.find(b=>+b.id===+order.id);if(booking)booking.status='Afsluttet';order.status='Afsluttet';
  try{let ids=new Set(JSON.parse(localStorage.getItem('pala_returned_completed_v1')||'[]').map(Number));ids.add(+order.id);localStorage.setItem('pala_returned_completed_v1',JSON.stringify([...ids]))}catch(e){}
  if(saved)await reloadData();
}
function applyReturnedCompletionCache(){
  try{let ids=new Set(JSON.parse(localStorage.getItem('pala_returned_completed_v1')||'[]').map(Number));bookings.forEach(b=>{if(ids.has(+b.id))b.status='Afsluttet'})}catch(e){}
}

async function setAllTentHardware(tentId){
  let list=await sb.rpc('order_checklist_get',{p_access_token:currentCheckToken});
  if(list.error)return alert(list.error.message);

  let lines=Array.isArray(list.data?.lines)?list.data.lines:[],
      hardware=lines.filter(x=>x.line_type==='hardware'&&+x.parent_tent_id===+tentId);

  if(!hardware.length)return alert('Der er ikke registreret hardware til dette telt.');

  let results=await Promise.all(hardware.map(line=>
    sb.rpc('order_checklist_change',{
      p_access_token:currentCheckToken,
      p_line_id:line.id,
      p_phase:checklistPhase,
      p_delta:0,
      p_set_all:true
    })
  ));

  let failed=results.find(x=>x.error);
  if(failed?.error)return alert(failed.error.message);

  await refreshWarehouseStatus();
  openOrderChecklist(currentCheckToken,checklistPhase);
}

async function getTentChecklistContext(tentId,bookingId){
  if(!bookingId)throw new Error('Vælg først hvilken ordre registreringen gælder for.');

  if(!isEmployeeLoggedIn())throw new Error('Medarbejderlogin kræves.');
  let tokenResult=await sb.rpc('employee_order_check_token',{p_token:employeeToken,p_booking_id:bookingId});
  if(tokenResult.error)throw new Error(tokenResult.error.message);

  let token=tokenResult.data;
  let list=await sb.rpc('order_checklist_get',{p_access_token:token});
  if(list.error)throw new Error(list.error.message);

  let lines=Array.isArray(list.data?.lines)?list.data.lines:[],
      tentLine=lines.find(x=>x.line_type==='tent'&&+x.item_id===+tentId),
      hardware=lines.filter(x=>x.line_type==='hardware'&&+x.parent_tent_id===+tentId);

  if(!tentLine)throw new Error('Teltet findes ikke på den valgte ordres pakkeliste.');
  return {token,tentLine,hardware,order:list.data?.order||{},bookingId:+bookingId};
}

async function quickTentWarehouseAction(tentId,action){
  let bookingId=selectedTentWarehouseBooking(tentId);
  if(action!=='returned'&&!bookingId)return alert('Vælg først hvilken ordre pakningen gælder for.');

  let btns=[...document.querySelectorAll(`[data-quick-tent="${tentId}"]`)];
  btns.forEach(b=>b.disabled=true);

  try{
    if(action==='packed'){
      let ctx=await getTentChecklistContext(tentId,bookingId),allLines=[ctx.tentLine,...ctx.hardware];
      let results=await Promise.all(allLines.map(line=>
        sb.rpc('order_checklist_change',{
          p_access_token:ctx.token,
          p_line_id:line.id,
          p_phase:'packed',
          p_delta:0,
          p_set_all:true
        })
      ));
      let failed=results.find(x=>x.error);
      if(failed?.error)throw new Error(failed.error.message);
      await refreshWarehouseStatus();
      alert('Teltet og alt hardware er markeret som pakket.');
      return openTent(tentId,bookingId);
    }

    if(action==='returned'){
      let returnBookings=tentOrderBookings(tentId).filter(b=>jobLocationStatus(b)==='Ude');
      if(!returnBookings.length)throw new Error('Der er ingen aktive jobs med dette telt, som står som Ude.');

      let contextResults=await Promise.all(returnBookings.map(async b=>{
        try{return {context:await getTentChecklistContext(tentId,b.id),error:null}}
        catch(error){return {context:null,error}}
      }));
      let unavailable=contextResults.find(result=>result.error);
      if(unavailable)throw new Error(`Mindst én returliste kunne ikke åbnes: ${unavailable.error.message||'ukendt fejl'}`);
      let contexts=contextResults.map(result=>result.context).filter(Boolean);
      if(!contexts.length)throw new Error('Returlisterne kunne ikke findes for teltets aktive jobs.');

      let returnLines=contexts.flatMap(ctx=>[ctx.tentLine,...ctx.hardware].map(line=>({ctx,line})));
      let packedResults=await Promise.all(returnLines.map(({ctx,line})=>
        sb.rpc('order_checklist_change',{
          p_access_token:ctx.token,
          p_line_id:line.id,
          p_phase:'packed',
          p_delta:0,
          p_set_all:true
        })
      ));
      let packedFailed=packedResults.find(x=>x.error);
      if(packedFailed?.error)throw new Error(packedFailed.error.message);

      let returnedResults=await Promise.all(returnLines.map(({ctx,line})=>
        sb.rpc('order_checklist_change',{
          p_access_token:ctx.token,
          p_line_id:line.id,
          p_phase:'returned',
          p_delta:0,
          p_set_all:true
        })
      ));
      let returnedFailed=returnedResults.find(x=>x.error);
      if(returnedFailed?.error)throw new Error(returnedFailed.error.message);

      await refreshWarehouseStatus();
      for(let ctx of contexts){
        let fresh=await sb.rpc('order_checklist_get',{p_access_token:ctx.token}),freshLines=Array.isArray(fresh.data?.lines)?fresh.data.lines:[];
        if(!fresh.error&&freshLines.filter(line=>(+line.qty_required||0)>0).every(line=>(+line.returned_qty||0)>=(+line.qty_required||0)))await autoFinishReturnedOrder(fresh.data?.order||ctx.order);
      }
      let count=contexts.length,damageBookingId=count===1?contexts[0].bookingId:null;
      if(confirm(`Teltet og alt hardware er markeret som returneret på ${count} ${count===1?'job':'jobs'}. Skal der registreres en skade til systuen?`))return showDamageForm(tentId,damageBookingId,'tent');
      return openTent(tentId);
    }

    if(action==='wet'){
      let ctx=await getTentChecklistContext(tentId,bookingId);
      // Et vådt telt skal være registreret som pakket, før tørrestatus kan sættes.
      let packed=await sb.rpc('order_checklist_change',{
        p_access_token:ctx.token,
        p_line_id:ctx.tentLine.id,
        p_phase:'packed',
        p_delta:0,
        p_set_all:true
      });
      if(packed.error)throw new Error(packed.error.message);

      let wet=await sb.rpc('order_checklist_set_drying',{
        p_access_token:ctx.token,
        p_line_id:ctx.tentLine.id,
        p_delta:0,
        p_set_all:true
      });
      if(wet.error)throw new Error(wet.error.message);

      await refreshWarehouseStatus();
      alert('Teltet er markeret som vådt / pakket hårdt og skal hænges til tørre ved retur.');
      return openTent(tentId,bookingId);
    }
  }catch(e){
    alert(e.message||String(e));
  }finally{
    btns.forEach(b=>b.disabled=false);
  }
}

function tentDocs(tentId){
  return tentDocuments.filter(d=>+d.tent_id===+tentId).sort((a,b)=>alpha(a.title,b.title));
}
function tentPics(tentId){
  return tentImages.filter(x=>+x.tent_id===+tentId).sort((a,b)=>String(a.created_at||'').localeCompare(String(b.created_at||'')));
}
function invalidateTentImages(tentId){
  let id=+tentId;tentImageLoadedIds.delete(id);tentImageLoadPromises.delete(id);tentImages=tentImages.filter(x=>+x.tent_id!==id);
}
async function ensureTentImages(tentId){
  let id=+tentId;if(tentImageLoadedIds.has(id))return tentPics(id);if(tentImageLoadPromises.has(id))return tentImageLoadPromises.get(id);
  let request=(async()=>{
    let r=await sb.from('tent_images').select('*').eq('tent_id',id).order('created_at');
    if(r.error){console.warn('Kunne ikke hente teltbilleder',r.error);return []}
    tentImages=tentImages.filter(x=>+x.tent_id!==id).concat(r.data||[]);tentImageLoadedIds.add(id);return tentPics(id);
  })().finally(()=>tentImageLoadPromises.delete(id));
  tentImageLoadPromises.set(id,request);return request;
}
async function addTentImage(tentId){
  if(!requireAdmin())return;
  let file=document.getElementById('tentImageFile')?.files?.[0],
      caption=(document.getElementById('tentImageCaption')?.value||'').trim();
  if(!file)return alert('Vælg et billede.');
  if(file.size>12*1024*1024)return alert('Billedet må højst være 12 MB før komprimering.');
  let data=await imgdata(file);
  if(!data)return alert('Billedet kunne ikke læses.');
  let r=await sb.rpc('admin_add_tent_image',{
    p_token:adminToken,p_tent_id:tentId,p_caption:caption,p_image_data:data
  });
  if(r.error)return alert(r.error.message);
  invalidateTentImages(tentId);await ensureTentImages(tentId);
  adminTent(tentId);
}
async function deleteTentImage(id,tentId){

  if(r.error)return alert(r.error.message);
  invalidateTentImages(tentId);await ensureTentImages(tentId);

async function openTentDocument(id){
  let r=await sb.from('tent_documents').select('title,file_name,mime_type,file_data').eq('id',id).single();
  if(r.error)return alert('Kunne ikke åbne dokumentet: '+r.error.message);
  let d=r.data;
  let w=window.open(d.file_data,'_blank');
  if(!w){
    let a=document.createElement('a');
    a.href=d.file_data;a.download=d.file_name||d.title||'dokument';a.target='_blank';
    document.body.appendChild(a);a.click();a.remove();
  }
}
function readFileDataUrl(file){
  return new Promise((resolve,reject)=>{
    let fr=new FileReader();
    fr.onload=()=>resolve(fr.result);
    fr.onerror=()=>reject(fr.error||new Error('Filen kunne ikke læses'));
    fr.readAsDataURL(file);
  });
}
async function addTentDocument(tentId){
  if(!requireAdmin())return;
  let title=(document.getElementById('tentDocTitle')?.value||'').trim(),
      file=document.getElementById('tentDocFile')?.files?.[0];
  if(!title)return alert('Skriv en titel, fx Opmålingsark eller Certificering.');
  if(!file)return alert('Vælg et dokument.');
  if(file.size>10*1024*1024)return alert('Dokumentet må højst være 10 MB.');
  let data;
  try{data=await readFileDataUrl(file)}catch(e){return alert('Kunne ikke læse dokumentet.')}
  let r=await sb.rpc('admin_add_tent_document',{
    p_token:adminToken,p_tent_id:tentId,p_title:title,p_file_name:file.name,
    p_mime_type:file.type||'application/octet-stream',p_file_data:data
  });
  if(r.error)return alert(r.error.message);
  await reloadData();
  adminTent(tentId);
}
async function deleteTentDocument(id,tentId){
  if(!requireAdmin())return;

  let r=await sb.rpc('admin_delete_tent_document',{p_token:adminToken,p_id:id});

}
async function deleteTentAdmin(id){

  let msg=`Slet teltet "${t.name}" permanent? Hardware og dokumenter på teltet slettes også.`;

function datesOverlap(aStart,aEnd,bStart,bEnd){
  return !!(aStart&&aEnd&&bStart&&bEnd&&aStart<=bEnd&&aEnd>=bStart);
}
function selectedTentRows(){
  let rows=[];
  Object.values(tents).forEach(t=>{
    let cb=document.getElementById('t'+t.id);
    if(cb?.checked){
      rows.push({tent_id:t.id,quantity:+document.getElementById('tq'+t.id)?.value||1});
    }
  });
  return rows;
}
function tentOverlapWarnings(currentId,startDate,endDate,rows,currentStatus){
  if(currentStatus==='Annulleret'||!startDate||!endDate)return [];
  let warnings=[];
  rows.forEach(sel=>{
    let t=tents[sel.tent_id];
    let hits=[],otherQty=0;
    bookings.forEach(b=>{
      if(+b.id===+currentId||b.status==='Annulleret')return;
      if(!datesOverlap(startDate,endDate,b.start_date,b.end_date))return;
      bt.filter(x=>+x.booking_id===+b.id&&+x.tent_id===+sel.tent_id).forEach(link=>{
        let q=+link.quantity||1;
        otherQty+=q;
        hits.push({
          booking:b,
          quantity:q
        });
      });
    });
    if(hits.length){
      let available=(t?.stock_count===null||t?.stock_count===undefined||t?.stock_count==='')?1:+t.stock_count;
      let total=otherQty+(+sel.quantity||1);
      warnings.push({
        tent:t,
        requested:+sel.quantity||1,
        available,
        total,
        overbooked:total>available,
        hits
      });
    }
  });
  return warnings;
}
function conflictWarningHtml(warnings){
  if(!warnings.length)return '';
  return warnings.map(w=>{
    let jobs=w.hits.map(h=>{
      let b=h.booking;
      return `${esc(b.customer_name||b.title||b.order_no||'Ordre')} (${esc(b.start_date)} → ${esc(b.end_date)}, ${h.quantity} stk.)`;
    }).join('<br>');
    let stockText=`Valgt nu: ${w.requested} · Allerede booket: ${w.total-w.requested} · På lager: ${w.available}`;
    return `<div style="border:2px solid ${w.overbooked?'#b42318':'#d69e2e'};background:${w.overbooked?'#fff1f0':'#fff8dc'};border-radius:10px;padding:10px;margin:8px 0">
      <b>${w.overbooked?uiIcon('alert')+'KRITISK DOBBELTBOOKING':uiIcon('alert')+'Overlappende booking'}: ${esc(w.tent?.name||'Telt')}</b>
      <div class="small" style="margin-top:5px">${jobs}</div>
      <div class="small" style="margin-top:5px"><b>${stockText}</b></div>
    </div>`;
  }).join('');
}

  if(!box)return;
  let start=document.getElementById('os')?.value||'';

function bookingSummary(bookingId){
  let id=+bookingId;if(bookingSummaryCache.has(id))return bookingSummaryCache.get(id);
  let tentRows=bookingTentRows(bookingId), tentCount=tentRows.reduce((n,r)=>n+(+r.quantity||1),0);
  let hardwareTotal=0,dryingCount=0;
  tentRows.forEach(r=>{
    let qty=(+r.quantity||1),t=r.tent;
    dryingCount+=Math.min(qty,warehouseDrying('tent',t.id));

  });

      hardwarePacked=Math.min(hardwareTotal,+q.hardware_packed||0);

async function saveOrderShift(bookingId,shiftId){
  if(!requireAdmin())return;
  let p_shift_date=document.getElementById('osdate').value;
  if(!p_shift_date)return alert('Vælg dato for vagten.');

  let r=await sb.rpc('admin_save_shift_v2',{
    p_token:adminToken,
    p_id:shiftId||null,
    p_booking_id:bookingId,
    p_shift_date,
    p_start_time:document.getElementById('osstart').value||null,
    p_end_time:document.getElementById('osend').value||null,
    p_workers_needed:+document.getElementById('osneeded').value||1,
    p_title:document.getElementById('ostitle').value.trim()||'Vagt',
    p_notes:document.getElementById('osnotes').value,
    p_daily_leader_employee_id:+document.getElementById('osleader').value||null
  });

  if(r.error){
    if(/login/i.test(r.error.message))clearAdminSession();
    return alert(r.error.message);
  }

  let savedShiftId=+r.data||+shiftId||0,inviteIds=[...document.querySelectorAll('.shiftInviteEmployee:checked')].map(input=>+input.value).filter(Boolean);
  if(savedShiftId&&inviteIds.length){let invite=await sb.rpc('admin_invite_staffing',{p_token:adminToken,p_shift_id:savedShiftId,p_employee_ids:inviteIds});if(invite.error)return alert('Vagten blev gemt, men forespørgslerne kunne ikke sendes: '+invite.error.message)}

  await reloadData();
  orderForm(bookings.find(x=>+x.id===+bookingId));
}

let palaPdfFontsPromise;
async function palaPdfFonts(doc){
  try{
    if(!palaPdfFontsPromise)palaPdfFontsPromise=Promise.all([400,700].map(async weight=>{
      const response=await fetch(new URL(`fonts/inter-${weight}.ttf`,document.baseURI));
      if(!response.ok)throw new Error('Skrifttypen kunne ikke hentes.');
      const bytes=new Uint8Array(await response.arrayBuffer());let binary='';
      for(let i=0;i<bytes.length;i+=8192)binary+=String.fromCharCode(...bytes.subarray(i,i+8192));
      return btoa(binary);
    })).catch(error=>{palaPdfFontsPromise=null;throw error});
    const fonts=await palaPdfFontsPromise;
    fonts.forEach((font,i)=>{const name=`Inter-${i}.ttf`;doc.addFileToVFS(name,font);doc.addFont(name,'Inter',i?'bold':'normal')});return true;
  }catch(error){alert('PDF-skrifttypen kunne ikke indlæses. Tjek internetforbindelsen og prøv igen.');return false}
}
// Shared print system: A4 landscape, 12 mm margins and measured table widths.
const PALA_PDF={ink:[32,43,61],blue:[16,131,255],line:[225,229,236],pale:[234,244,255],muted:[102,112,133]};
function palaPdfHeader(doc,title,subtitle,qrData,checkUrl){
  const c=PALA_PDF,w=doc.internal.pageSize.getWidth(),right=w-12;
  doc.setFillColor(...c.blue);doc.rect(12,10,2,9,'F');
  doc.setTextColor(...c.ink);doc.setFont('Inter','bold');doc.setFontSize(16);doc.text('PALA',18,16);
  doc.setTextColor(...c.muted);doc.setFont('Inter','normal');doc.setFontSize(7);doc.text('LOGISTICS',38,16);
  doc.setTextColor(...c.ink);doc.setFont('Inter','bold');doc.setFontSize(21);
  const lines=doc.splitTextToSize(String(title).replace(/[–—]/g,'-'),w-24-(qrData?42:0));

let cloudSyncChannel=null,cloudSyncTimer=null,cloudSyncBusy=false;
function stopCloudSync(){if(cloudSyncTimer)clearTimeout(cloudSyncTimer);cloudSyncTimer=null;if(cloudSyncChannel){sb.removeChannel(cloudSyncChannel);cloudSyncChannel=null}}
function cloudRefreshIsSafe(){let p=new URLSearchParams(location.search);return !p.has('order')&&!p.has('admin')&&!p.has('damage')&&!p.has('check')&&!p.has('workshopEdit')&&!document.querySelector('.staff-form,#newOrderStaffingCard,[data-layout-editor],.dialog-backdrop,.user-menu-popover.open')}
function scheduleCloudSync(payload){
  if(!payload||payload.table==='tent_images'){tentImages=[];tentImageLoadedIds.clear()}
  if(!isEmployeeLoggedIn()||!cloudRefreshIsSafe())return;
  if(cloudSyncTimer)clearTimeout(cloudSyncTimer);cloudSyncTimer=setTimeout(refreshFromCloud,650);

async function refreshFromCloud(){

function setupCloudSync(){
  stopCloudSync();if(!isEmployeeLoggedIn())return;
  cloudSyncChannel=sb.channel(`pala-sync-${employeeId}-${Date.now()}`).on('postgres_changes',{event:'*',schema:'public'},payload=>scheduleCloudSync(payload)).subscribe();
}

async function reloadData(){

    sb.from('tents').select('*').order('id'),
    sb.from('hardware').select('*').order('tent_id').order('sort_order'),
    fetchInventoryCatalog(),
    sb.from('bookings').select('*').order('start_date'),
    sb.from('booking_tents').select('*'),
    sb.from('booking_inventory').select('*'),
    sb.from('employees').select('*').order('sort_order').order('name'),
    sb.from('staffing_shifts').select('*').order('shift_date').order('start_time'),
    sb.from('staffing_assignments').select('*'),

async function exportStaffingPlanPDF(periodStart,periodEnd){

// Photos are compressed on the device, saved transactionally and fetched only on demand.
async function readDamagePhoto(file){
  if(!file)return null;if(file.size>20000000)throw new Error('Vælg et billede under 20 MB.');
  if(!/^image\/(jpeg|png|webp|heic|heif)$/i.test(file.type)&&! /\.(jpe?g|png|webp|heic|heif)$/i.test(file.name))throw new Error('Vælg et JPEG-, PNG- eller WebP-billede.');
  let url=URL.createObjectURL(file);try{let img=new Image();img.src=url;await img.decode();let scale=Math.min(1,1400/Math.max(img.naturalWidth,img.naturalHeight)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);let data=canvas.toDataURL('image/jpeg',.8);if(data.length>1500000)data=canvas.toDataURL('image/jpeg',.5);if(data.length>1500000)throw new Error('Billedet er for stort. Vælg et mindre billede.');return data}catch(e){throw new Error('Billedet kunne ikke læses. Prøv JPEG eller PNG. '+e.message)}finally{URL.revokeObjectURL(url)}
}

  let commit=await disasterFetchJson(`https://api.github.com/repos/${PALA_BACKUP_REPOSITORY}/commits/${PALA_BACKUP_BRANCH}`),commitSha=commit.sha,tree=await disasterFetchJson(`${commit.commit.tree.url}?recursive=1`),files=(tree.tree||[]).filter(row=>row.type==='blob');
  if(!files.length)throw new Error('GitHub-repositoryet indeholder ingen filer.');
  let source=zip.folder('app-source'),done=0,manifestFiles=[];
  for(let start=0;start<files.length;start+=4){
    let batch=files.slice(start,start+4);
    await Promise.all(batch.map(async row=>{
      let response=await fetch(disasterRawUrl(commitSha,row.path),{cache:'no-store'});
      if(!response.ok)throw new Error(`Kunne ikke hente appfilen ${row.path} (${response.status})`);
      let bytes=await response.arrayBuffer();source.file(row.path,bytes);
      if(row.path.startsWith('recovery/database/'))zip.file(`database/schema/${row.path.split('/').pop()}`,bytes);
      manifestFiles.push({path:row.path,git_sha:row.sha,size:row.size??bytes.byteLength});
      done++;setBackupProgress(`Henter appkode… ${done}/${files.length}`);
    }));
  }
  manifestFiles.sort((a,b)=>a.path.localeCompare(b.path));
  let meta={repository:PALA_BACKUP_REPOSITORY,branch:PALA_BACKUP_BRANCH,commit_sha:commitSha,tree_sha:commit.commit.tree.sha,commit_message:commit.commit.message||'',commit_date:commit.commit.committer?.date||commit.commit.author?.date||'',file_count:manifestFiles.length,files:manifestFiles};
  zip.file('app-source/repository-snapshot.json',JSON.stringify(meta,null,2));
  return meta;
}
function disasterWriteStructuredData(zip,portable){
  zip.file('database/data/pala-backup.json',JSON.stringify(portable,null,2));
  Object.entries(portable.tables||{}).forEach(([name,value])=>zip.file(`database/data/tables/${backupSafeName(name)}.json`,JSON.stringify(value,null,2)));
  Object.entries(portable.extensions||{}).forEach(([name,value])=>zip.file(`database/data/extensions/${backupSafeName(name)}.json`,JSON.stringify(value,null,2)));
  zip.file('database/data/device-state.json',JSON.stringify(portable.device_state||{},null,2));
}
function disasterRestoreGuide(raw,repo){
  return `# PALA disaster recovery\n\nOprettet: ${raw.created_at}\nGit commit: ${repo.commit_sha}\nRepository: ${repo.repository}\n\n## Hvad backupen indeholder\n\n- app-source/: hele GitHub-repositoryet ved den angivne commit, inklusive index.html, service worker, manifest, logoer, ikoner, fonts og recovery-filer.\n- database/schema/: database-setupfiler til at opbygge et nyt Supabase-projekt.\n- database/data/: aktuelle PALA-data i JSON, opdelt pr. tabel/område.\n- files/: billeder, PDF'er og andre uploadede filer trukket ud som rigtige filer.\n- manifest.json: kontrolfil med versionsinfo, antal poster, filoversigt og eventuelle eksportadvarsler.\n\n## Gendannelse\n\n1. Opret et nyt tomt Supabase-projekt.\n2. Kør SQL-filerne i database/schema/ i nummerorden. Legacy-filer i app-source/recovery/legacy er kun historik.\n3. Importér data fra database/data/ og bevar de originale id'er/relationer.\n4. Læg app-source/ i et nyt GitHub-repository eller anden statisk hosting.\n5. Opdatér den publicerbare Supabase URL/key i index.html til det nye projekt, hvis projektadressen er ændret.\n6. Test login, kalender, lager, pakkelister, systue, bemanding, billeder og dokumenter før systemet sættes i drift.\n\n## Sikkerhedscredentials\n\nAktive login-sessioner, midlertidige adgangstokens, database-passwords, service-role keys og medarbejdernes PIN/password-hemmeligheder eksporteres ikke til en browser-download. Ved disaster recovery skal disse roteres/nulstilles. Det beskytter mod, at en stjålet ZIP-fil samtidig bliver en kopi af alle aktive adgangsnøgler.\n\n## Kontrol\n\nHvis manifest.json indeholder warnings, skal de gennemgås før backupen betragtes som verificeret.\n`;
}

exportSecurityBackupZip=async function(){

    zip.file('README.txt',`PALA FULD SYSTEMBACKUP\n\nGit commit: ${repo.commit_sha}\nOprettet: ${raw.created_at}\n\nSe RESTORE.md og manifest.json før gendannelse.\n`);
    setBackupProgress('Pakker fuld systembackup…');
    let blob=await zip.generateAsync({type:'blob',compression:'DEFLATE',compressionOptions:{level:6}},meta=>setBackupProgress(`Pakker ZIP… ${Math.round(meta.percent)} %`));
    let date=new Date(),stamp=`${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`,url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`PALA-FULD-SYSTEMBACKUP-${stamp}.zip`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);localStorage.setItem(PALA_BACKUP_LAST_KEY,new Date().toISOString());showAdminBackup();
  }catch(error){console.error(error);alert('Systembackup kunne ikke oprettes: '+(error.message||error));setBackupProgress('Systembackup mislykkedes. Prøv igen.');if(button)button.disabled=false}
