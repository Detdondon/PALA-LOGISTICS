<!doctype html>
<html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f6f8"><title>PALA</title>
<style>:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#111b3a;background:#f7f3ec}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}.boot{width:min(420px,100%);background:#fffdfa;border:1px solid #e5ddd2;border-radius:26px;padding:24px;box-sizing:border-box;box-shadow:0 10px 25px rgba(22,31,70,.08)}h1{margin:0 0 8px;font-size:28px}p{margin:0;color:#5f6982;line-height:1.45}</style></head>
<body><div class="boot"><h1>PALA</h1><p id="bootStatus">Indlæser…</p></div>
<script>
(async()=>{
  const status=document.getElementById('bootStatus');
  const timeout=(promise,ms,label)=>Promise.race([promise,new Promise((_,reject)=>setTimeout(()=>reject(new Error(label)),ms))]);
  try{
    try{if('serviceWorker'in navigator)await timeout(navigator.serviceWorker.getRegistrations().then(regs=>Promise.all(regs.map(r=>r.unregister()))),2000,'')}catch(_){ }
    try{if('caches'in window)await timeout(caches.keys().then(keys=>Promise.all(keys.filter(k=>k.startsWith('pala-')).map(k=>caches.delete(k)))),2000,'')}catch(_){ }

    const controller=typeof AbortController!=='undefined'?new AbortController():null;
    const timer=setTimeout(()=>controller&&controller.abort(),8000);
    let response;
    try{response=await fetch('./app.html?v=172',{cache:'no-store',signal:controller?controller.signal:undefined})}
    finally{clearTimeout(timer)}
    if(!response.ok)throw new Error('Appfil kunne ikke hentes (HTTP '+response.status+')');
    let html=await response.text();

    const sdkPattern=/<script\s+src=["']https:\/\/cdn\.jsdelivr\.net\/npm\/@supabase\/supabase-js@2["']><\/script>/i;
    if(!sdkPattern.test(html))throw new Error('PALA-appfilen har et uventet format');
    html=html.replace(sdkPattern,'<script src="./supabase-lite.js?v=1"><\/script>');

    html=html.replace(/if\('serviceWorker'in navigator&&location\.protocol!==['"]file:['"]\)navigator\.serviceWorker\.register\(['"]\.\/sw\.js['"]\)\.catch\(\(\)=>\{\}\);?/g,'');

    const scripts=['calendar-stability.js','calendar-order-fixes.js','workshop-edit.js','calendar-controller.js','calendar-toolbar.js','settings-icon.js','warehouse-categories.js'];
    for(const name of scripts){
      const escaped=name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
      html=html.replace(new RegExp('<script\\s+src=["\\\']'+escaped+'[^"\\\']*["\\\']><\\/script>','gi'),'');
    }
    const extensions='<script src="workshop-edit.js?v=3"><\/script><script src="calendar-controller.js?v=9"><\/script><script src="calendar-toolbar.js?v=1"><\/script><script src="settings-icon.js?v=4"><\/script><script src="warehouse-categories.js?v=1"><\/script>';
    html=html.replace(/<\/body>/i,extensions+'</body>');

    html=html.replace(/\nload\(\);\n/,`\nload().catch(function(err){\n  console.error('PALA startup',err);\n  var host=document.getElementById('app');\n  if(host)host.innerHTML='<div class="card"><h2>PALA kunne ikke starte</h2><p class="muted" id="palaBootError"></p></div>';\n  var out=document.getElementById('palaBootError');\n  if(out)out.textContent=(err&&err.message)||String(err||'Ukendt opstartsfejl');\n});\n`);

    document.open();document.write(html);document.close();
  }catch(err){
    console.error('PALA bootstrap',err);
    status.textContent='PALA kunne ikke starte: '+((err&&err.name==='AbortError')?'Appfilen fik timeout':(err&&err.message?err.message:String(err)));
  }
})();
</script></body></html>
