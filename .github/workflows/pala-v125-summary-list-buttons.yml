name: Apply PALA v125 summary list buttons

on:
  push:
    branches: [main]
    paths:
      - '.github/pala_v125_summary_list_buttons.py'
      - '.github/workflows/pala-v125-summary-list-buttons.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply focused summary-button patch
        run: python .github/pala_v125_summary_list_buttons.py
      - name: Verify JavaScript syntax
        run: |
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).filter(s=>s.trim());
          scripts.forEach(code=>new Function(code));
          console.log('Inline JavaScript syntax OK');
          NODE
      - name: Verify focused patch
        run: |
          git diff --check
          grep -q "PALA v125 · summary buttons open filtered list" index.html
          grep -q "calendarViewMode='list'" index.html
          grep -q "openUnifiedSummaryListV125" index.html
      - name: Commit update
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Open calendar summary buttons in filtered list view'
          git push
