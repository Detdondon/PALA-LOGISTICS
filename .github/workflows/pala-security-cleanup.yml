name: PALA security cleanup
on:
  push:
    paths: ['.github/workflows/pala-security-cleanup.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove legacy shared-code path
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('Administrér medarbejdere og deres login. Kun Lukas, Miranda og Emil er administratorer.','Administrér medarbejdere og deres login.')
          s=s.replace('Nye medarbejdere får startkoden 4211. Adminrollen gives automatisk kun til Lukas, Miranda og Emil.','Du vælger en unik startkode, når medarbejderen oprettes.')
          old="async function addEmployee(){if(!requireAdmin())return;let name=document.getElementById('newEmpName').value.trim();if(!name)return alert('Skriv medarbejderens navn.');let r=await sb.rpc('admin_save_employee',{p_token:adminToken,p_id:null,p_name:name,p_is_admin:false});if(r.error)return alert(r.error.message);await reloadData();showAdminEmployees()}"
          new="async function addEmployee(){if(!requireAdmin())return;let name=document.getElementById('newEmpName').value.trim();if(!name)return alert('Skriv medarbejderens navn.');let p_initial_pin=(prompt('Vælg en unik startkode på 4-8 cifre til medarbejderen:')||'').trim();if(!/^\\d{4,8}$/.test(p_initial_pin))return alert('Startkoden skal være 4-8 cifre.');let r=await sb.rpc('admin_create_employee',{p_token:adminToken,p_name:name,p_is_admin:false,p_initial_pin});if(r.error)return alert(r.error.message);await reloadData();showAdminEmployees()}"
          if old in s: s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
          git diff --check
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'PALA Security Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Remove legacy shared-code employee path'
          git push
