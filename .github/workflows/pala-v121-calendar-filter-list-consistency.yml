name: Apply PALA v121 calendar filter consistency

on:
  push:
    branches: [main]
    paths:
      - '.github/pala_v121_calendar_filter_list_consistency.py'
      - '.github/workflows/pala-v121-calendar-filter-list-consistency.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply calendar filter list consistency patch
        run: python .github/pala_v121_calendar_filter_list_consistency.py
      - name: Verify JavaScript syntax
        run: |
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).filter(s=>s.trim());
          scripts.forEach(code=>new Function(code));
          console.log('Inline JavaScript syntax OK');
          NODE
      - name: Verify focused diff
        run: |
          git diff --check
          git diff --stat
          git diff -- index.html
      - name: Commit update
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Keep calendar filters consistent in list views'
          git push
