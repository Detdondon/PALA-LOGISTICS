name: PALA calendar regression once

on:
  push:
    branches: [main]
    paths:
      - '.github/pala_calendar_regression_trigger'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check calendar-controller.js
          node --check sw.js
          node --check tests/calendar-controller.test.js
      - name: Calendar regression suite
        run: node tests/calendar-controller.test.js
      - name: Loader assertions
        run: |
          grep -q 'calendar-controller.js?v=1' index.html
          ! grep -q 'calendar-stability.js?v=2' index.html
          ! grep -q 'calendar-order-fixes.js?v=1' index.html
          grep -q 'pala-v150-calendar-controller' sw.js
