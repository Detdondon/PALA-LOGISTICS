name: Repair PALA single tent groups

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5
      - name: Restore index before bad patch
        run: git show ec727850e899bc7af4932ba121a954d2c867ae5d:index.html > index.html
      - name: Apply safe single-tent patch
        run: python .github/pala_repair_single_tent_groups.py
      - name: Verify JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S|re.I)
          inline='\n'.join(s for s in scripts if s.strip())
          p=Path(tempfile.gettempdir())/'pala-inline.js'
          p.write_text(inline,encoding='utf-8')
          subprocess.run(['node','--check',str(p)],check=True)
          PY
      - name: Verify warehouse code still exists
        run: |
          grep -q "function warehouseStateMarkup(kind,label)" index.html
          grep -q "const showTentsV103=showTents;" index.html
          grep -q "warehouseGroupedRows=function(rows,keyFn,cardFn,flatSingles=false)" index.html
          grep -q "flatSingles&&items.length===1" index.html
      - name: Commit repaired index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Repair warehouse groups and flatten single tent versions"
          git push
