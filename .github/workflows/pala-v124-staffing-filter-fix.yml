name: Apply PALA v124 staffing filter fix

on:
  push:
    branches: [main]
    paths:
      - '.github/pala_v124_staffing_filter_fix.py'
      - '.github/workflows/pala-v124-staffing-filter-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply focused staffing filter fix
        run: python .github/pala_v124_staffing_filter_fix.py
      - name: Verify JavaScript syntax
        run: |
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).filter(s=>s.trim());
          scripts.forEach(code=>new Function(code));
          console.log('Inline JavaScript syntax OK');
          NODE
      - name: Verify filter patch
        run: |
          git diff --check
          grep -q "PALA v124 · strict unified calendar type filtering" index.html
          grep -q "mainCalendarTypeFilterV120==='staffing'.*kind==='staffing'" index.html
      - name: Commit update
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix staffing-only calendar filter'
          git push
