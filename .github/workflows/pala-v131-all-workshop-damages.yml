name: Apply PALA v131 all workshop damages

on:
  push:
    branches: [main]
    paths:
      - '.github/pala_v131_all_workshop_damages.py'
      - '.github/workflows/pala-v131-all-workshop-damages.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply focused patch
        run: python .github/pala_v131_all_workshop_damages.py
      - name: Verify JavaScript syntax
        run: |
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).filter(s=>s.trim());
          scripts.forEach(code=>new Function(code));
          console.log('Inline JavaScript syntax OK');
          NODE
      - name: Verify focused change
        run: |
          git diff --check
          grep -q "PALA v131 · systue summary shows all damage tasks" index.html
          grep -q "renderWorkshopSummaryAllDamagesV131" index.html
          grep -q "Afsluttede skader" index.html
          grep -q "task.status==='open'" index.html
          grep -q "task.status==='completed'" index.html
      - name: Commit update
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Show all damage tasks in workshop summary'
          git push
