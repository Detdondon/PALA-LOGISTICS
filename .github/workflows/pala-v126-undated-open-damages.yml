name: Apply PALA v126 undated open damages

on:
  push:
    branches: [main]
    paths:
      - '.github/pala_v126_undated_open_damages.py'
      - '.github/workflows/pala-v126-undated-open-damages.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply focused undated-damage patch
        run: python .github/pala_v126_undated_open_damages.py
      - name: Verify JavaScript syntax
        run: |
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).filter(s=>s.trim());
          scripts.forEach(code=>new Function(code));
          console.log('Inline JavaScript syntax OK');
          NODE
      - name: Verify focused patch
        run: |
          git diff --check
          grep -q "PALA v126 · open workshop damages are undated tasks" index.html
          grep -q "workshop-undated-tasks" index.html
          grep -q "t.status==='open'" index.html
      - name: Commit update
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Show open workshop damages as undated tasks'
          git push
