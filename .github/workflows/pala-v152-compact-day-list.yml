name: Apply PALA v152 compact calendar day list

on:
  push:
    branches: [main]
    paths:
      - '.github/pala_v152_compact_day_list_trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply focused patch
        run: python .github/pala_v152_dense_day_list.py
      - name: Syntax checks
        run: |
          node --check calendar-controller.js
          node --check sw.js
          node --check tests/calendar-controller.test.js
      - name: Regression tests
        run: node tests/calendar-controller.test.js
      - name: Verify compact day list
        run: |
          grep -q 'PALA v152 · compact calendar day/list cards' calendar-controller.js
          grep -q 'calendar-day-detail-card' calendar-controller.js
          grep -q 'calendar-controller.js?v=3' index.html
          grep -q 'pala-v152-compact-day-list' sw.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calendar-controller.js index.html sw.js
          git diff --cached --quiet || git commit -m "Compact calendar day list cards"
          git push
