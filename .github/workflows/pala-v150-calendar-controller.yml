name: Apply PALA v150 calendar controller

on:
  push:
    branches: [main]
    paths:
      - '.github/pala_v150_calendar_controller_trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply loader patch
        run: python .github/pala_v150_calendar_controller_patch.py
      - name: Syntax checks
        run: |
          node --check calendar-controller.js
          node --check sw.js
      - name: Verify calendar invariants
        run: |
          grep -q 'calendar-controller.js?v=1' index.html
          ! grep -q 'calendar-stability.js?v=2' index.html
          ! grep -q 'calendar-order-fixes.js?v=1' index.html
          grep -q "pala-v150-calendar-controller" sw.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Use unified calendar controller"
          git push
