name: Apply PALA v157 staffing month list

on:
  push:
    branches: [main]
    paths:
      - '.github/pala_v157_staffing_month_list_trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply focused patch
        run: python .github/pala_v157_staffing_month_list_patch.py
      - name: Syntax checks
        run: |
          node --check calendar-controller.js
          node --check sw.js
          node --check tests/calendar-controller.test.js
      - name: Regression tests
        run: node tests/calendar-controller.test.js
      - name: Verify requested fix
        run: |
          grep -q 'calendarMonthDetailHtmlV157' calendar-controller.js
          grep -q 'LISTEVISNING · HELE MÅNEDEN' calendar-controller.js
          grep -q 'understaffed staffing must appear in the full-month detail list' tests/calendar-controller.test.js
          grep -q 'pala-v157-staffing-month-list' sw.js
          grep -q 'calendar-controller.js?v=7' sw.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calendar-controller.js tests/calendar-controller.test.js sw.js index.html
          git diff --cached --quiet || git commit -m "Fix understaffed staffing in calendar month list"
          git push
