name: Build complete PALA workspace bundle

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pala-export-complete.yml'

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add workspace notes
        run: |
          cat > WORKSPACE-README.txt <<'TXT'
          PALA Logistics - komplet workspace-pakke

          Denne mappe indeholder den aktuelle kode fra GitHub-repositoriet Detdondon/PALA-LOGISTICS.

          Vigtige filer:
          - index.html: hele PALA-webappen
          - manifest.webmanifest og sw.js: PWA/service worker
          - Logo.png og pala-icon-*.png / pala-icon.svg: logoer og ikoner
          - fonts/: lokale Inter-fontfiler
          - recovery/database/: database-schema og migrations til Supabase
          - recovery/legacy/: ældre recovery/seed-SQL

          PALA Supabase project ref:
          zlnzmdxffjxjdijzyuwx

          Bemærk:
          Pakken indeholder database-schema/migrations/recovery-filer fra repositoriet, men ikke et live dump af alle aktuelle rækker fra Supabase og ingen private secrets/service-role keys.
          TXT
          git rev-parse HEAD > CURRENT-COMMIT.txt
      - name: Create bundle
        run: |
          zip -r PALA-LOGISTICS-COMPLETE.zip . \
            -x '.git/*' \
            -x '.github/workflows/pala-export-complete.yml' \
            -x 'PALA-LOGISTICS-COMPLETE.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: PALA-LOGISTICS-COMPLETE
          path: PALA-LOGISTICS-COMPLETE.zip
          if-no-files-found: error
