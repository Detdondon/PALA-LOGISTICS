name: Apply PALA v159 open damage priority

on:
  push:
    branches: [main]
    paths:
      - '.github/pala_v159_open_damage_priority_trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply focused patch
        run: python .github/pala_v159_open_damage_priority_patch.py
      - name: Syntax checks
        run: |
          node --check calendar-controller.js
          node --check sw.js
          node --check tests/calendar-controller.test.js
      - name: Regression tests
        run: node tests/calendar-controller.test.js
      - name: Verify requested fix
        run: |
          grep -q 'open workshop damages first only in Systue view' calendar-controller.js
          grep -q 'open workshop damage must be first when Systue is selected' tests/calendar-controller.test.js
          grep -q 'open damage must not be force-pinned when type filter is Alt' tests/calendar-controller.test.js
          grep -q 'pala-v159-workshop-open-damage-priority' sw.js
          grep -q 'calendar-controller.js?v=9' sw.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calendar-controller.js tests/calendar-controller.test.js sw.js index.html
          git diff --cached --quiet || git commit -m "Prioritize open damages in Systue lists"
          git push
