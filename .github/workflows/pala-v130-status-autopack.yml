name: Apply PALA v130 status and autopack

on:
  push:
    branches: [main]
    paths:
      - '.github/pala_v130_status_autopack.py'
      - '.github/workflows/pala-v130-status-autopack.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply focused patch
        run: python .github/pala_v130_status_autopack.py
      - name: Verify JavaScript syntax
        run: |
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).filter(s=>s.trim());
          scripts.forEach(code=>new Function(code));
          console.log('Inline JavaScript syntax OK');
          NODE
      - name: Verify focused change
        run: |
          git diff --check
          grep -q "PALA v130 · forespørgsel status and automatic packing on Ude" index.html
          grep -q "'På lager','Forespørgsel','Ude','Afsluttet'" index.html
          grep -q "markBookingChecklistPackedV130" index.html
          grep -q "p_phase:'packed'" index.html
          grep -q "Forespørgsel" recovery/database/005_pala_v130_forespoergsel_status.sql
      - name: Commit update
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html recovery/database/005_pala_v130_forespoergsel_status.sql
          git commit -m 'Add inquiry status and auto-pack outgoing jobs'
          git push
