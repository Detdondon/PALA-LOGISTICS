name: Apply PALA v128 open damage render order

on:
  push:
    branches: [main]
    paths:
      - '.github/pala_v128_open_damage_render_order.py'
      - '.github/workflows/pala-v128-open-damage-render-order.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply focused patch
        run: python .github/pala_v128_open_damage_render_order.py
      - name: Verify JavaScript syntax
        run: |
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).filter(s=>s.trim());
          scripts.forEach(code=>new Function(code));
          console.log('Inline JavaScript syntax OK');
          NODE
      - name: Verify focused change
        run: |
          git diff --check
          grep -q "PALA v128 · wait for unified calendar before rendering open damages" index.html
          grep -q "showOpenWorkshopDamageListV122=async function" index.html
          grep -q "await showCalendar();" index.html
      - name: Commit update
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix open damage list render timing'
          git push
