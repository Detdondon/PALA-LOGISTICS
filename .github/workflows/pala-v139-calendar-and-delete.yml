name: Apply PALA v139 calendar and warehouse updates

on:
  push:
    branches: [main]
    paths:
      - '.github/pala_v139_calendar_and_delete.py'
      - '.github/workflows/pala-v139-calendar-and-delete.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply focused patch
        run: python .github/pala_v139_calendar_and_delete.py
      - name: Verify JavaScript syntax
        run: |
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).filter(s=>s.trim());
          scripts.forEach(code=>new Function(code));
          console.log('Inline JavaScript syntax OK');
          NODE
      - name: Verify focused changes
        run: |
          git diff --check
          grep -q "PALA v139 · active lists, understaffed filter and unified warehouse delete" index.html
          grep -q "Ubemandede vagter" index.html
          grep -q "bookingActiveInListV139" index.html
          grep -q "admin_delete_warehouse_record" index.html
          grep -q "badge.textContent='v139'" index.html
          grep -q "understaffed'" index.html
      - name: Commit update
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Unify warehouse delete and active calendar lists'
          git push
