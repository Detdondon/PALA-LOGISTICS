name: Apply PALA v141 compact calendar list

on:
  push:
    branches: [main]
    paths:
      - '.github/pala_v141_compact_calendar_list.py'
      - '.github/workflows/pala-v141-compact-calendar-list.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply focused patch
        run: python .github/pala_v141_compact_calendar_list.py
      - name: Verify JavaScript syntax
        run: |
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).filter(s=>s.trim());
          scripts.forEach(code=>new Function(code));
          console.log('Inline JavaScript syntax OK');
          NODE
      - name: Verify focused changes
        run: |
          git diff --check
          grep -q "PALA v141 · compact unified calendar list cards" index.html
          grep -q ".view-list .job-card" index.html
          grep -q ".view-list .staff-card" index.html
          grep -q ".view-list .workshop-job-card" index.html
          grep -q "badge.textContent='v141'" index.html
      - name: Commit update
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Compact calendar list cards'
          git push
