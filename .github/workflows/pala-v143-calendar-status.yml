name: PALA v143 calendar status stability

on:
  push:
    branches: [main]
    paths:
      - '.github/pala_v143_calendar_status_patch.py'
      - '.github/workflows/pala-v143-calendar-status.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply patch
        run: python .github/pala_v143_calendar_status_patch.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Load calendar status stability directly"
          git push
