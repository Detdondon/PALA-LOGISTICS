name: Apply PALA production plan

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply production plan patch
        run: python .github/pala_production_plan_patch.py
      - name: Verify JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          required=['async function exportProductionPlanPDF(','showProductionPlanExportDialog()','data-production-plan-export','Produktionsplan-']
          missing=[x for x in required if x not in text]
          if missing:
              raise SystemExit('Missing production-plan markers: '+repr(missing))
          matches=re.findall(r'<script(?![^>]*\\bsrc=)[^>]*>([\\s\\S]*?)</script>',text,re.I)
          if not matches:
              raise SystemExit('No inline script found')
          Path('/tmp/pala-inline.js').write_text('\n'.join(matches),encoding='utf-8')
          PY
          node --check /tmp/pala-inline.js
      - name: Commit production plan feature
        run: |
          if git diff --quiet -- index.html; then
            echo "No index change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add admin production plan PDF export"
          git push
