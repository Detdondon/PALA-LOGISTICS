name: Apply PALA v132 calendar top cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/pala_v132_calendar_top_cleanup.py'
      - '.github/workflows/pala-v132-calendar-top-cleanup.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply focused patch
        run: python .github/pala_v132_calendar_top_cleanup.py
      - name: Verify JavaScript syntax
        run: |
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).filter(s=>s.trim());
          scripts.forEach(code=>new Function(code));
          console.log('Inline JavaScript syntax OK');
          NODE
      - name: Verify focused change
        run: |
          git diff --check
          grep -q "PALA v132 · calendar summary layout and production plan cleanup" index.html
          grep -q "grid-template-columns:repeat(3,minmax(0,1fr))" index.html
          grep -q "workshopCount} systue" index.html
          grep -q "data-production-plan-export" index.html
      - name: Commit update
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix calendar summary layout and duplicate production plan'
          git push
