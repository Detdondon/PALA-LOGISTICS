name: Apply PALA backup visibility

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply backup visibility patch
        run: python .github/pala_backup_visibility_patch.py
      - name: Verify JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('index.html').read_text(encoding='utf-8')
          start=text.index('<script>')+len('<script>')
          end=text.rindex('</script>')
          Path('/tmp/pala.js').write_text(text[start:end],encoding='utf-8')
          PY
          node --check /tmp/pala.js
      - name: Commit change
        run: |
          if git diff --quiet -- index.html; then
            echo "No index change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Expose admin ZIP backup controls"
          git push
