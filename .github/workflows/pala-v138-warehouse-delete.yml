name: Apply PALA v138 warehouse delete

on:
  push:
    branches: [main]
    paths:
      - '.github/pala_v138_warehouse_delete.py'
      - '.github/workflows/pala-v138-warehouse-delete.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply focused patch
        run: python .github/pala_v138_warehouse_delete.py
      - name: Verify JavaScript syntax
        run: |
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).filter(s=>s.trim());
          scripts.forEach(code=>new Function(code));
          console.log('Inline JavaScript syntax OK');
          NODE
      - name: Verify focused change
        run: |
          git diff --check
          grep -q "PALA v138 · admin delete from warehouse" index.html
          grep -q "installWarehouseDeleteButtonV138('tent'" index.html
          grep -q "admin_delete_tent" index.html
          grep -q "admin_delete_inventory" index.html
          grep -q "badge.textContent='v138'" index.html
      - name: Commit update
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add admin delete actions to warehouse editors'
          git push
