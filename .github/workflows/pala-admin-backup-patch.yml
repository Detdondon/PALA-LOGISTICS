name: Add PALA admin backup export

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-backup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add admin ZIP backup feature
        run: |
          python - <<'PY'
          from pathlib import Path

          path=Path('index.html')
          text=path.read_text(encoding='utf-8')
          if 'async function exportSecurityBackupZip()' in text:
              raise SystemExit('Backup feature already present')

          employee_button="onclick=\"showAdminEmployees()\">${uiIcon('people','ui-icon icon-action')} Medarbejdere</button><span class=\"small muted\""
          backup_button="onclick=\"showAdminEmployees()\">${uiIcon('people','ui-icon icon-action')} Medarbejdere</button><button class=\"btn ${activeTab==='backup'?'primary':''}\" onclick=\"showAdminBackup()\">${uiIcon('document','ui-icon icon-action')} Backup</button><span class=\"small muted\""
          if employee_button not in text:
              raise SystemExit('Could not find admin tab insertion point')
          text=text.replace(employee_button,backup_button,1)

          route_needle="if(p.get('admin')==='employees')return showAdminEmployees();if(p.get('admin')==='inventory')return showAdminInventory();"
          route_repl="if(p.get('admin')==='employees')return showAdminEmployees();if(p.get('admin')==='backup')return showAdminBackup();if(p.get('admin')==='inventory')return showAdminInventory();"
          if route_needle not in text:
              raise SystemExit('Could not find admin route insertion point')
          text=text.replace(route_needle,route_repl,1)

          marker='function showAdminEmployees(){'
          if marker not in text:
              raise SystemExit('Could not find backup code insertion point')

          code=r'''
const PALA_BACKUP_LAST_KEY='pala_last_security_backup_at';
const PALA_BACKUP_TABLES=['tents','hardware','inventory','bookings','booking_tents','booking_inventory','employees','staffing_shifts','staffing_assignments'];
function backupSafeName(value){return String(value||'fil').replace(/[\\/:*?"<>|\u0000-\u001f]/g,'-').replace(/\s+/g,' ').trim().slice(0,120)||'fil'}
function backupMonthKey(value){let d=value?new Date(value):new Date();return Number.isNaN(d.getTime())?'':`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`}
function backupLastLabel(){let raw=localStorage.getItem(PALA_BACKUP_LAST_KEY);if(!raw)return 'Ingen backup registreret på denne enhed';let d=new Date(raw);return Number.isNaN(d.getTime())?'Ingen backup registreret på denne enhed':`Sidste eksport på denne enhed: ${new Intl.DateTimeFormat('da-DK',{dateStyle:'long',timeStyle:'short'}).format(d)}`}
function backupDue(){let raw=localStorage.getItem(PALA_BACKUP_LAST_KEY);return !raw||backupMonthKey(raw)!==backupMonthKey()}
function showAdminBackup(){
  if(!isAdminLoggedIn())return showAdminLogin();act('na');history.replaceState(null,'',location.pathname+'?admin=backup');
  let due=backupDue();
  app.innerHTML=`<div class="card"><h2>Administration</h2>${adminTabs('backup')}</div><section class="card"><div class="row"><div><div class="small muted">SIKKERHEDSBACKUP</div><h2 style="margin:3px 0">Månedlig komplet backup</h2></div><span class="pill ${due?'yellow':'green'}">${due?'Backup anbefales':'Backup udført denne måned'}</span></div><p>Eksporterer systemets data og tilhørende filer som én ZIP-fil direkte på din enhed. ZIP-filen indeholder databaseudtræk, pakke-/returstatus, lagerdata, medarbejdere, bemanding, systue, møder, billeder og dokumenter.</p><div class="backup-status card" style="box-shadow:none"><strong>${esc(backupLastLabel())}</strong><p class="small muted">Registreringen af sidste eksport gemmes kun på denne enhed. Selve backupfilen gemmes dér, hvor din browser normalt gemmer downloads.</p></div><button id="securityBackupButton" class="btn primary" onclick="exportSecurityBackupZip()">${uiIcon('document')} Eksportér komplet ZIP-backup</button><p id="securityBackupProgress" class="small muted" style="margin-top:10px">Kun administratorer kan eksportere en backup. Aktive login-tokens gemmes ikke i filen.</p></section>`;
}
async function ensureZipTools(){
  try{await loadExternalLibrary('jszip','https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js',()=>typeof window.JSZip==='function');return true}catch(error){console.warn(error);return false}
}
function setBackupProgress(text){let host=document.getElementById('securityBackupProgress');if(host)host.textContent=text}
async function backupFetchAllTable(table){
  let rows=[],offset=0,pageSize=1000;
  while(true){let r=await sb.from(table).select('*').range(offset,offset+pageSize-1);if(r.error)throw new Error(`${table}: ${r.error.message}`);let part=r.data||[];rows.push(...part);if(part.length<pageSize)break;offset+=pageSize}
  return rows;
}
async function backupFullTentDocuments(errors){
  let rows=[];
  for(let meta of tentDocuments){let r=await sb.from('tent_documents').select('*').eq('id',meta.id).single();if(r.error){errors.push(`tent_documents/${meta.id}: ${r.error.message}`);continue}if(r.data)rows.push(r.data)}
  return rows;
}
async function backupFullTentImages(errors){
  let ids=Object.keys(tents).map(Number).filter(Boolean);for(let id of ids){try{await ensureTentImages(id)}catch(error){errors.push(`tent_images/tent_${id}: ${error.message||error}`)}}
  return tentImages.slice();
}
async function backupWorkshopDocuments(errors){
  let rows=[];
  for(let meta of workshopJobDocuments){let r=await sb.rpc('employee_workshop_job_document',{p_token:employeeToken,p_id:+meta.id});if(r.error){errors.push(`workshop_document/${meta.id}: ${r.error.message}`);continue}let row=Array.isArray(r.data)?r.data[0]:r.data;if(row)rows.push({...meta,...row})}
  return rows;
}
async function backupDamagePhotos(errors){
  let rows=[];
  for(let id of [...damagePhotoIds]){let r=await sb.rpc('employee_damage_photo',{p_token:employeeToken,p_task_id:+id});if(r.error){errors.push(`damage_photo/${id}: ${r.error.message}`);continue}if(r.data)rows.push({task_id:+id,image_data:r.data})}
  return rows;
}
async function backupChecklists(errors){
  let rows=[];
  for(let booking of bookings){let token=await sb.rpc('employee_order_check_token',{p_token:employeeToken,p_booking_id:+booking.id});if(token.error){errors.push(`checklist/${booking.id}: ${token.error.message}`);continue}let list=await sb.rpc('order_checklist_get',{p_access_token:token.data});if(list.error){errors.push(`checklist/${booking.id}: ${list.error.message}`);continue}rows.push({booking_id:+booking.id,data:list.data})}
  return rows;
}
function backupFallbackTable(name){
  if(name==='tents')return Object.values(tents).map(row=>{let copy={...row};delete copy.hardware;return copy});
  if(name==='hardware')return Object.values(tents).flatMap(t=>t.hardware||[]);
  if(name==='inventory')return inventory;
  if(name==='bookings')return bookings;
  if(name==='booking_tents')return bt;
  if(name==='booking_inventory')return bi;
  if(name==='employees')return employees;
  if(name==='staffing_shifts')return staffingShifts;
  if(name==='staffing_assignments')return staffingAssignments;
  return [];
}
async function collectSecurityBackup(){
  let valid=await validateAdminSession();if(!valid)throw new Error('Admin-login er udløbet. Log ind igen.');
  setBackupProgress('Opdaterer PALA-data…');await reloadData();await Promise.all([loadWarehouseExtensions(),loadWorkshopData(),loadStaffingInvitations(),refreshWarehouseStatus()]);
  let errors=[],tables={};
  for(let name of PALA_BACKUP_TABLES){setBackupProgress(`Henter ${name}…`);try{tables[name]=await backupFetchAllTable(name)}catch(error){errors.push(error.message||String(error));tables[name]=backupFallbackTable(name)}}
  setBackupProgress('Henter billeder og dokumenter…');tables.tent_documents=await backupFullTentDocuments(errors);tables.tent_images=await backupFullTentImages(errors);
  let workshopDocuments=await backupWorkshopDocuments(errors),damagePhotos=await backupDamagePhotos(errors);
  setBackupProgress('Henter pakke- og returlister…');let checklists=await backupChecklists(errors);
  return {
    format:'PALA full security backup',format_version:1,created_at:new Date().toISOString(),created_by:{employee_id:employeeId,name:employeeName},app:{url:location.origin+location.pathname,public_app_url:publicAppUrl||'',warehouse_categories:warehouseCategories||[]},
    tables,
    extensions:{tent_parts:tentParts,special_hardware:specialHardware,hardware_catalog:hardwareCatalog,meetings:palaMeetings,tent_notes:tentNotes,workshop_tasks:workshopTasks,workshop_jobs:workshopJobs,workshop_job_documents:workshopDocuments,damage_photos:damagePhotos,staffing_invitations:staffingInvitations,employee_leave_requests:staffLeaveRequests,admin_leave_requests:adminLeaveRequests,booking_checklists:checklists,booking_checklist_summaries:bookingChecklistSummaries,warehouse_status:warehouseStatus},
    device_state:{returned_completed:JSON.parse(localStorage.getItem('pala_returned_completed_v1')||'[]'),calendar_view:calendarViewMode,staffing_view:staffingViewMode,workshop_view:workshopViewMode},
    warnings:errors
  };
}
function backupMimeExtension(mime){return {'image/jpeg':'jpg','image/png':'png','image/webp':'webp','image/gif':'gif','application/pdf':'pdf','text/plain':'txt','text/csv':'csv','application/json':'json'}[String(mime||'').toLowerCase()]||String(mime||'').split('/')[1]?.replace(/[^a-z0-9]+/gi,'')||'bin'}
function backupEmbeddedFileName(parent,key,mime,index){let original=parent&&typeof parent==='object'&&(parent.file_name||parent.filename);if(original)return `${String(index).padStart(4,'0')}-${backupSafeName(original)}`;let id=parent&&typeof parent==='object'&&(parent.id??parent.task_id??parent.workshop_job_id??parent.tent_id);let ext=backupMimeExtension(mime),kind=/image|photo/i.test(key)?'billede':'fil';return `${String(index).padStart(4,'0')}-${backupSafeName(kind+(id!=null?'-'+id:''))}.${ext}`}
function backupExtractEmbedded(value,zip,trail,files,counter,parent){
  if(typeof value==='string'&&value.startsWith('data:')){let match=value.match(/^data:([^;,]+)?(;base64)?,([\s\S]*)$/);if(match){let mime=match[1]||'application/octet-stream',folder=mime.startsWith('image/')?'images':'documents',index=counter.value++,name=backupEmbeddedFileName(parent,trail[trail.length-1]||'file',mime,index),filePath=`files/${folder}/${name}`;if(match[2])zip.file(filePath,match[3],{base64:true});else zip.file(filePath,decodeURIComponent(match[3]));files.push({path:filePath,mime_type:mime,source:trail.join('.')});return {$file:filePath,mime_type:mime}}}
  if(Array.isArray(value))return value.map((item,index)=>backupExtractEmbedded(item,zip,trail.concat(index),files,counter,item));
  if(value&&typeof value==='object'){let out={};for(let [key,item] of Object.entries(value))out[key]=backupExtractEmbedded(item,zip,trail.concat(key),files,counter,value);return out}
  return value;
}
async function exportSecurityBackupZip(){
  if(!requireAdmin())return;let button=document.getElementById('securityBackupButton');if(button)button.disabled=true;
  try{
    if(!await ensureZipTools())throw new Error('ZIP-funktionen kunne ikke indlæses. Tjek internetforbindelsen og prøv igen.');
    let raw=await collectSecurityBackup(),zip=new JSZip(),files=[],counter={value:1};setBackupProgress('Pakker filer i ZIP…');let portable=backupExtractEmbedded(raw,zip,['backup'],files,counter,raw);
    let counts={};Object.entries(raw.tables||{}).forEach(([key,value])=>counts[key]=Array.isArray(value)?value.length:0);Object.entries(raw.extensions||{}).forEach(([key,value])=>{if(Array.isArray(value))counts[key]=value.length});
    let manifest={format:raw.format,format_version:raw.format_version,created_at:raw.created_at,created_by:raw.created_by,record_counts:counts,file_count:files.length,warnings:raw.warnings||[],files};
    zip.file('manifest.json',JSON.stringify(manifest,null,2));zip.file('data/pala-backup.json',JSON.stringify(portable,null,2));zip.file('README.txt',`PALA SIKKERHEDSBACKUP\n\nOprettet: ${raw.created_at}\nFormatversion: ${raw.format_version}\n\nIndhold:\n- manifest.json: oversigt og antal poster\n- data/pala-backup.json: komplet systemdata med referencer til udtrukne filer\n- files/: billeder, PDF-filer og andre vedhæftninger\n\nAktive login-tokens og adgangskoder eksporteres ikke som browser-sessioner.\nEventuelle advarsler under eksporten står i manifest.json.\n`);
    let blob=await zip.generateAsync({type:'blob',compression:'DEFLATE',compressionOptions:{level:6}},meta=>setBackupProgress(`Pakker ZIP… ${Math.round(meta.percent)} %`));let date=new Date(),stamp=`${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`,url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`PALA-sikkerhedsbackup-${stamp}.zip`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);localStorage.setItem(PALA_BACKUP_LAST_KEY,new Date().toISOString());showAdminBackup();
  }catch(error){console.error(error);alert('Backup kunne ikke oprettes: '+(error.message||error));setBackupProgress('Backup mislykkedes. Prøv igen.');if(button)button.disabled=false}
}

'''
          text=text.replace(marker,code+marker,1)

          path.write_text(text,encoding='utf-8')
          PY

      - name: Verify backup patch syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          required=['async function exportSecurityBackupZip()','function showAdminBackup()','PALA_BACKUP_TABLES','?admin=backup','jszip@3.10.1']
          missing=[x for x in required if x not in text]
          if missing: raise SystemExit('Missing backup markers: '+repr(missing))
          matches=re.findall(r'<script>([\s\S]*?)</script>',text)
          if not matches: raise SystemExit('No inline script found')
          Path('/tmp/pala-inline.js').write_text(matches[-1],encoding='utf-8')
          PY
          node --check /tmp/pala-inline.js

      - name: Commit backup feature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add admin monthly full ZIP backup export"
          git push
