name: Add PALA admin backup export

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-backup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add admin ZIP backup feature
        run: python .github/pala_backup_patch.py
      - name: Verify backup patch syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          required=['async function exportSecurityBackupZip()','function showAdminBackup()','PALA_BACKUP_TABLES','?admin=backup','jszip@3.10.1']
          missing=[x for x in required if x not in text]
          if missing: raise SystemExit('Missing backup markers: '+repr(missing))
          matches=re.findall(r'<script>([\s\S]*?)</script>',text)
          if not matches: raise SystemExit('No inline script found')
          Path('/tmp/pala-inline.js').write_text(matches[-1],encoding='utf-8')
          PY
          node --check /tmp/pala-inline.js
      - name: Commit backup feature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add admin monthly full ZIP backup export"
          git push
