name: Apply PALA v155 calendar row

on:
  push:
    branches: [main]
    paths:
      - '.github/pala_v155_status_row_trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply focused patch
        run: python .github/pala_v155_status_row_patch.py
      - name: Syntax checks
        run: |
          node --check calendar-controller.js
          node --check workshop-edit.js
          node --check sw.js
          node --check tests/calendar-controller.test.js
      - name: Regression tests
        run: node tests/calendar-controller.test.js
      - name: Verify requested changes
        run: |
          grep -q 'PALA v155 · status and pack action on one row' calendar-controller.js
          grep -q 'job-status-action-row' calendar-controller.js
          grep -q 'deleteWorkshopDamage' workshop-edit.js
          grep -q 'employee_delete_workshop_task' workshop-edit.js
          grep -q 'calendar-controller.js?v=6' index.html
          grep -q 'workshop-edit.js?v=2' sw.js
          grep -q 'pala-v155-status-row-damage-delete' sw.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calendar-controller.js index.html sw.js
          git diff --cached --quiet || git commit -m "Align pack action with job status"
          git push
