name: Apply PALA v154 readable compact cards

on:
  push:
    branches: [main]
    paths:
      - '.github/pala_v154_readable_compact_cards_trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply focused patch
        run: python .github/pala_v154_mobile_readability.py
      - name: Syntax checks
        run: |
          node --check calendar-controller.js
          node --check sw.js
          node --check tests/calendar-controller.test.js
      - name: Regression tests
        run: node tests/calendar-controller.test.js
      - name: Verify version markers
        run: |
          grep -q 'PALA v154 · readable compact mobile cards' calendar-controller.js
          grep -q 'calendar-controller.js?v=5' index.html
          grep -q 'pala-v154-readable-compact-cards' sw.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calendar-controller.js index.html sw.js
          git diff --cached --quiet || git commit -m "Improve compact calendar mobile readability"
          git push
