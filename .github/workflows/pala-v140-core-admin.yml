name: Apply PALA v140 core admin safeguard

on:
  push:
    branches: [main]
    paths:
      - '.github/pala_v140_core_admin_ui.py'
      - '.github/workflows/pala-v140-core-admin.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply focused patch
        run: python .github/pala_v140_core_admin_ui.py
      - name: Verify JavaScript syntax
        run: |
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).filter(s=>s.trim());
          scripts.forEach(code=>new Function(code));
          console.log('Inline JavaScript syntax OK');
          NODE
      - name: Verify focused changes
        run: |
          git diff --check
          grep -q "PALA v140 · core admins always retain admin mode access" index.html
          grep -q "function isCoreAdminV140" index.html
          grep -q "persistentAuthSet('pala_employee_admin','1')" index.html
          grep -q "badge.textContent='v140'" index.html
      - name: Commit update
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Keep core admins available in admin mode'
          git push
