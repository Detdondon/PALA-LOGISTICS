name: Apply PALA v135 non-admin staffing default

on:
  push:
    branches: [main]
    paths:
      - '.github/pala_v135_non_admin_staffing_default.py'
      - '.github/workflows/pala-v135-non-admin-staffing-default.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply focused patch
        run: python .github/pala_v135_non_admin_staffing_default.py
      - name: Verify JavaScript syntax
        run: |
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).filter(s=>s.trim());
          scripts.forEach(code=>new Function(code));
          console.log('Inline JavaScript syntax OK');
          NODE
      - name: Verify focused change
        run: |
          git diff --check
          grep -q "PALA v135 · non-admin calendar starts on staffing" index.html
          grep -q "mainCalendarTypeFilterV120='staffing'" index.html
          grep -q "isEmployeeLoggedIn()&&!employeeIsAdmin" index.html
          grep -q "pala_non_admin_calendar_default_v135" index.html
          grep -q "badge.textContent='v135'" index.html
          grep -q 'app-version" hidden>v135' index.html
      - name: Commit update
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Default non-admin calendar to staffing'
          git push
