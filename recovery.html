<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f6f8">
<title>PALA recovery</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#111b3a;background:#f7f3ec}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}
.card{width:min(440px,100%);background:#fffdfa;border:1px solid #e5ddd2;border-radius:26px;padding:24px;box-sizing:border-box;box-shadow:0 10px 25px rgba(22,31,70,.08)}
h1{margin:0 0 10px;font-size:28px}p{color:#5f6982;line-height:1.45}.spinner{width:28px;height:28px;border:3px solid #d8dfef;border-top-color:#0f51e3;border-radius:50%;animation:spin .8s linear infinite;margin-top:18px}@keyframes spin{to{transform:rotate(360deg)}}
button{border:0;border-radius:16px;padding:13px 18px;font:inherit;font-weight:800;background:#0f51e3;color:#fff;display:none;margin-top:16px}
</style>
</head>
<body>
<div class="card">
<h1>Gendanner PALA</h1>
<p id="status">Rydder gammel app-cache og installerer den aktuelle version…</p>
<div class="spinner" id="spinner"></div>
<button id="retry" onclick="location.reload()">Prøv igen</button>
</div>
<script>
(async()=>{
  const status=document.getElementById('status'),spinner=document.getElementById('spinner'),retry=document.getElementById('retry');
  try{
    if('caches' in window){const keys=await caches.keys();await Promise.all(keys.filter(k=>k.startsWith('pala-')).map(k=>caches.delete(k)))}
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
      const reg=await navigator.serviceWorker.register('./sw.js?v=169',{scope:'./',updateViaCache:'none'});
      await reg.update();
      let worker=reg.installing||reg.waiting||reg.active;
      if(worker&&worker.state!=='activated')await new Promise((resolve,reject)=>{
        const timer=setTimeout(resolve,8000);
        worker.addEventListener('statechange',()=>{if(worker.state==='activated'){clearTimeout(timer);resolve()}else if(worker.state==='redundant'){clearTimeout(timer);reject(new Error('Service worker kunne ikke aktiveres'))}});
      });
      await new Promise(resolve=>setTimeout(resolve,500));
    }
    status.textContent='PALA er nulstillet. Åbner appen…';
    location.replace('./?recovered='+Date.now());
  }catch(err){
    console.error(err);status.textContent='Recovery fejlede: '+(err&&err.message?err.message:String(err));spinner.style.display='none';retry.style.display='inline-block';
  }
})();
</script>
</body>
</html>
